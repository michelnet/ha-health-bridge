name: Home Assistant validation
on:
  push:
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/home-assistant-validation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    # Repository metadata can only be checked after the standalone repo exists.
    if: github.repository == 'michelnet/ha-health-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
