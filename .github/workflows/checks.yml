name: Integration lint
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.8
      - run: >-
          ruff check custom_components --target-version py314
          --select E,F,I,UP,B,ASYNC --line-length 88
